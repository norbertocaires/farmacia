<nav class="navbar-logout">
  <div class="navbar-brand">
    <span class="farmacia-logo"><i class="fas fa-capsules"></i></span>
    <span class="farmacia-name">Postinho</span>
  </div>

  <div class="navbar-actions">
    <button class="theme-toggle" (click)="themeService.toggle()" [title]="themeService.isLight() ? 'Tema escuro' : 'Tema claro'">
      @if (themeService.isLight()) {
        <i class="fas fa-moon"></i>
      } @else {
        <i class="fas fa-sun"></i>
      }
    </button>

    <a routerLink="/login" routerLinkActive="active" class="btn-login">
      Entrar
    </a>
    
    <a routerLink="/register" routerLinkActive="active" class="btn-register">
      Cadastrar-se
    </a>
  </div>
</nav>
