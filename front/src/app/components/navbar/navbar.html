<header class="navbar">
  <div class="brand">
    <div class="brand-mark"><i class="fas fa-capsules"></i></div>
    <span class="brand-name">Postinho</span>
  </div>

  <button class="hamburger-btn" (click)="toggleNavMenu()" [title]="navMenuAberto ? 'Fechar menu' : 'Abrir menu'">
    <i class="fas" [class]="navMenuAberto ? 'fa-xmark' : 'fa-bars'"></i>
  </button>

  <nav class="menu" [class.open]="navMenuAberto" (click)="navMenuAberto = false">
    <a routerLink="/dashboard" routerLinkActive="active">Minha medicações</a>
    @if (canSeeCatalog()) {
      <a routerLink="/medicineCatalog" routerLinkActive="active">Medicações</a>
    }
    @if (canSeeImport()) {
      <a routerLink="/importMedicinesComponent" routerLinkActive="active">Importar Medicamentos</a>
    }
    @if (canSeeUserAdmin()) {
      <a routerLink="/useradmin" routerLinkActive="active">Administração de Usuários</a>
    }
    @if (canSeeLogs()) {
      <a routerLink="/logs" routerLinkActive="active">Logs</a>
    }
  </nav>

  <div class="user-actions">
    <div class="user-avatar" [title]="userName()">
      @if (userPhoto()) {
        <img class="user-photo" [src]="userPhoto()!" [alt]="userName()">
      } @else {
        <span class="user-initials">{{userInitials()}}</span>
      }
    </div>

    <button class="theme-toggle" (click)="themeService.toggle()" [title]="themeService.nextThemeLabel()">
      <i class="fas" [class]="themeService.nextThemeIcon()"></i>
    </button>

    <div class="dropdown-container">
      <button class="settings-btn" (click)="toggleMenu()" title="Configurações">
        <i class="fas fa-gear"></i>
      </button>

      @if (menuAberto) {
      <div class="dropdown-menu">
        <button (click)="navegarPara('/profile')"><i class="fas fa-user"></i> Minha Conta</button>
        <div class="divider"></div>
        <button class="logout-item" (click)="logout()"><i class="fas fa-right-from-bracket"></i> Sair</button>
      </div>
      }
    </div>
  </div>
</header>
