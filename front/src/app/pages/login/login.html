<main class="auth-container">
  <div class="auth-card">
    <h1>Login</h1>
    
    <form (submit)="onLogin()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="seu@email.com">
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="******">
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="divider"><span>ou</span></div>

    <asl-google-signin-button type="standard" size="large" locale="pt-BR"></asl-google-signin-button>

    <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
  </div>
</main>
